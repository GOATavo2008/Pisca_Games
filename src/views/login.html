<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"content="width=device-width, initial-scale=1.0">
  <title>Sistema Escolar Login</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="card">
    <h1>Sistema Escolar</h1>
    <h2>Login</h2>
    <form id="formLogin">
    <label for="login">
      Login
    </label>
    <input
      type="text"
      id="login"
      required
    >
    <label for="senha">
      Senha
    </label>
  <input
    type="password"
    id="senha"
    required
  >

  <button type="submit">
    Entrar
  </button>

</form>

<p id="mensagem"></p>
  <a href="/cadastro.html">
    Cadastre-se
  </a>

</div>

<script src="/js/login.js"></script>

</body>

</html>
